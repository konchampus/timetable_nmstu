name: magtu-companion
x-app: &app
 build:
  context: .
  dockerfile: backend/Dockerfile
 image: magtu-companion-backend:local
 env_file:
  - ${COMPANION_ENV_FILE:?Set absolute path to protected backend environment file}
 restart: unless-stopped
 init: true
 read_only: true
 tmpfs:
  - /tmp:size=32m,mode=1777
 cap_drop: [ALL]
 security_opt: [no-new-privileges:true]
 networks: [companion]
 logging:
  driver: local
  options:
   max-size: 10m
   max-file: '3'
services:
 api:
  <<: *app
  command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log, --no-proxy-headers]
  expose: ['8000']
  mem_limit: 512m
  cpus: 1.0
 bot:
  <<: *app
  command: [python, -m, app.bot]
  mem_limit: 384m
  cpus: 0.75
 worker:
  <<: *app
  command: [python, -m, app.worker]
  mem_limit: 512m
  cpus: 1.0
 migrate:
  <<: *app
  env_file:
   - ${COMPANION_MIGRATION_ENV_FILE:?Set absolute path to migration environment with separate DB role}
  command: [alembic, upgrade, head]
  profiles: [maintenance]
  restart: 'no'
 web:
  build:
   context: .
   dockerfile: frontend/Dockerfile
  image: magtu-companion-web:local
  restart: unless-stopped
  init: true
  depends_on: [api]
  ports: ['127.0.0.1:18080:8080']
  read_only: true
  tmpfs:
   - /tmp:size=32m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [companion]
  mem_limit: 128m
  cpus: 0.5
  logging:
   driver: local
   options:
    max-size: 10m
    max-file: '3'
networks:
 companion:
  driver: bridge
