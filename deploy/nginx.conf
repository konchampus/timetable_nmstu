worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 server_tokens off;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 client_max_body_size 64k;
 client_body_timeout 15s;
 send_timeout 30s;
 keepalive_timeout 30s;
 map $uri $cache_policy {
  default "no-store";
  ~^/assets/ "public, max-age=31536000, immutable";
 }
 server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  add_header Cache-Control $cache_policy always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
  location /api/ {
   proxy_pass http://api:8000;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header Connection "";
   proxy_set_header X-Forwarded-For "";
   proxy_set_header X-Forwarded-Proto "";
   proxy_connect_timeout 5s;
   proxy_read_timeout 30s;
   proxy_send_timeout 30s;
   proxy_buffering off;
  }
  location ~ ^/(docs|redoc|openapi.json) { return 404; }
  location ~ /\. { return 404; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
